services:
  bot:
    build: .
    image: pasito-bot:local
    container_name: pasito-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Argentina/Buenos_Aires
      DATA_DIR: /data
    volumes:
      - pasito_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 160m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "pasito_bot.health"]
      interval: 5m
      timeout: 15s
      retries: 3
      start_period: 2m

volumes:
  pasito_data:
